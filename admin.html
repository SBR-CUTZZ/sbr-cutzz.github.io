<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SBR_CUTZZ Admin</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0c0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SBR Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Espace admin : mêmes couleurs que le site, une colonne pensée pour le téléphone */
:root{
  --ink:#0c0b0a; --coal:#161412; --graphite:#211e1b; --line:#332e29;
  --fg:#f5f2ee; --mist:#a59d94; --gold:#c9a45c; --gold-soft:#e2c88f;
  --green:#25d366; --warn:#f2b632; --err:#f08b7d;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 48px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.brand{font-family:var(--display);font-weight:900;letter-spacing:.14em;font-size:22px;text-transform:uppercase}
.brand b{color:var(--gold)}
.brand small{font-family:var(--body);font-size:11px;letter-spacing:.18em;color:var(--mist);margin-left:8px}
.stack{display:grid;gap:14px}
.card{background:var(--coal);border:1px solid var(--line);border-radius:20px;padding:18px}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 18px;font:800 13px var(--body);letter-spacing:.04em;cursor:pointer;text-decoration:none;color:var(--fg);background:var(--graphite)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:12px}
.btn.green{background:rgba(37,211,102,.14);color:var(--green)}
.btn.red{background:rgba(240,139,125,.12);color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;color:#d9d3cc}
input,select,textarea{width:100%;margin-top:6px;background:var(--graphite);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:500 16px var(--body)}
textarea{resize:vertical;min-height:64px}
.muted{color:var(--mist);font-size:13px}
.err{color:var(--err);font-size:14px;font-weight:600}
.ok{color:var(--green);font-size:14px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--graphite);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mist)}
.tabs{display:flex;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--coal)}
.tabs button{flex:1;border:0;background:none;color:var(--mist);font:800 13px var(--body);padding:9px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.day{font-weight:800;text-transform:capitalize;margin:14px 0 8px;color:var(--gold-soft)}
.bk{border-top:1px solid var(--line);padding:12px 0}
.bk:first-of-type{border-top:0}
.bk .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bk .time{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.bk .name{font-weight:800}
.bk .meta{font-size:13px;color:var(--mist);word-break:break-word}
.bk .meta a{color:var(--fg)}
.bk .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:var(--graphite);color:var(--mist);white-space:nowrap}
.pill.confirmed{background:rgba(201,164,92,.15);color:var(--gold)}
.pill.done{background:rgba(37,211,102,.12);color:var(--green)}
.pill.cancelled,.pill.no_show{background:rgba(240,139,125,.12);color:var(--err)}
.bk.off .time,.bk.off .name{color:var(--mist);text-decoration:line-through}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.preview{margin-top:10px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));color:var(--ink);font-weight:800;font-size:14px;text-align:center;padding:10px 14px;border-radius:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">SBR<b>_</b>CUTZZ<small>ADMIN</small></div>
    <button class="btn ghost small" id="logout" hidden>Déconnexion</button>
  </header>

  <section class="card" id="noConfig" hidden>
    <h2>Pas encore branché</h2>
    <p class="muted">Le projet Supabase n’est pas encore renseigné dans le site.</p>
  </section>

  <form class="card stack" id="login" hidden>
    <h2>Connexion</h2>
    <label>E-mail<input type="email" id="email" autocomplete="username" required></label>
    <label>Mot de passe<input type="password" id="password" autocomplete="current-password" required></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn gold full" id="loginBtn">SE CONNECTER</button>
  </form>

  <main class="stack" id="app" hidden>
    <section class="card">
      <div class="stats" id="stats"></div>
    </section>

    <section class="card">
      <div class="tabs" role="group" aria-label="Rendez-vous">
        <button id="tUp" aria-pressed="true">À venir</button>
        <button id="tPast" aria-pressed="false">Historique</button>
      </div>
      <div id="list"></div>
      <p class="muted" id="listInfo" style="margin:12px 0 0"></p>
    </section>

    <section class="card stack">
      <h2 style="margin:0">Bannière promo</h2>
      <label>Texte en français<textarea id="bfr" maxlength="140" placeholder="Ex. Cette semaine -25% si tu réserves sur le site"></textarea></label>
      <label>Texte en anglais (facultatif)<textarea id="ben" maxlength="140" placeholder="Ex. 25% off this week when you book online"></textarea></label>
      <div class="preview" id="bprev" hidden></div>
      <p class="muted" style="margin:0">Laisse vide pour cacher la bannière.</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn gold" id="bsave">ENREGISTRER</button>
        <button class="btn ghost" id="bclear">Retirer la bannière</button>
        <span class="ok" id="bmsg" role="status"></span>
      </div>
    </section>

    <section class="card stack">
      <h2 style="margin:0">Bloquer un créneau ou une journée</h2>
      <div class="row">
        <label>Jour<input type="date" id="kday"></label>
        <label>Heure<select id="kslot"><option value="">Toute la journée</option></select></label>
      </div>
      <label>Note (visible seulement ici)<input id="knote" maxlength="80" placeholder="Ex. Congé, rendez-vous perso…"></label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn gold" id="kadd">BLOQUER</button>
        <span class="muted" id="kmsg" role="status"></span>
      </div>
      <div id="blocks"></div>
    </section>
  </main>
</div>

<script>
// Même projet Supabase que index.html
const CONFIG={supabaseUrl:"https://leuxyvrvphfbxsczobzd.supabase.co",supabaseKey:"sb_publishable_tnCSbUJwiwzxvl2lPwGPCA_QSq9SVbX"};
const TZ="Australia/Melbourne";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const BASE=CONFIG.supabaseUrl.replace(/\/$/,"");
let session=null,tab="up",rows=[],settings=null,blocks=[];

function today(){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function addDays(d,n){const[y,m,x]=d.split("-").map(Number);return new Date(Date.UTC(y,m-1,x+n)).toISOString().slice(0,10)}
const dayLabel=d=>new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).format(new Date(d+"T12:00:00Z"));
const hm=s=>s.slice(0,5).replace(":","h");
const toMin=x=>{const[h,m]=String(x).split(":").map(Number);return h*60+m};

async function auth(grant,body){
  const r=await fetch(`${BASE}/auth/v1/token?grant_type=${grant}`,{method:"POST",headers:{apikey:CONFIG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"auth");
  session={token:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,email:j.user&&j.user.email};
  store.set("sbr_admin_rt",session.refresh);return session}
async function ensureSession(){if(session&&Date.now()<session.exp)return;const rt=session?session.refresh:store.get("sbr_admin_rt");if(!rt)throw new Error("auth");await auth("refresh_token",{refresh_token:rt})}
async function api(path,opt={}){
  await ensureSession();
  const r=await fetch(`${BASE}/rest/v1/${path}`,{method:opt.method||"GET",headers:{apikey:CONFIG.supabaseKey,Authorization:"Bearer "+session.token,"Content-Type":"application/json",Prefer:"return=representation"},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||"http_"+r.status);
  return j}

function show(view){$("#noConfig").hidden=view!=="noconfig";$("#login").hidden=view!=="login";$("#app").hidden=view!=="app";$("#logout").hidden=view!=="app"}

$("#login").onsubmit=async e=>{e.preventDefault();$("#loginErr").textContent="";$("#loginBtn").disabled=true;
  try{await auth("password",{email:$("#email").value.trim(),password:$("#password").value});await start()}
  catch(err){$("#loginErr").textContent=/Invalid login/i.test(err.message)?"E-mail ou mot de passe incorrect.":"Connexion impossible : "+err.message}
  $("#loginBtn").disabled=false};
$("#logout").onclick=async()=>{try{await fetch(`${BASE}/auth/v1/logout`,{method:"POST",headers:{apikey:CONFIG.supabaseKey,Authorization:"Bearer "+session.token}})}catch(e){}
  session=null;store.set("sbr_admin_rt",null);show("login")};

async function start(){
  const ok=await api("rpc/is_admin",{method:"POST",body:{}});
  if(!ok){session=null;store.set("sbr_admin_rt",null);show("login");$("#loginErr").textContent="Ce compte n’a pas accès à l’espace admin.";return}
  show("app");await loadAll()}

async function loadAll(){
  const t=today(),monthStart=t.slice(0,8)+"01",from=[monthStart,addDays(t,-30)].sort()[0];
  [rows,settings,blocks]=await Promise.all([
    api(`bookings?select=*&day=gte.${from}&day=lte.${addDays(t,90)}&order=day.asc,slot.asc`),
    api("settings?select=*&id=eq.1").then(r=>r[0]),
    api(`blocks?select=*&day=gte.${t}&order=day.asc,slot.asc.nullsfirst`)]);
  renderStats();renderList();renderBlocks();
  if(document.activeElement!==$("#bfr")&&document.activeElement!==$("#ben")){$("#bfr").value=settings.banner_fr||"";$("#ben").value=settings.banner_en||"";preview()}
  fillSlots()}

function renderStats(){const t=today(),wk=addDays(t,6),m=t.slice(0,7);
  const live=rows.filter(r=>r.status!=="cancelled");
  const n=[["Aujourd’hui",live.filter(r=>r.day===t&&r.status==="confirmed").length],
    ["7 prochains jours",live.filter(r=>r.day>=t&&r.day<=wk&&r.status==="confirmed").length],
    ["Ce mois-ci",live.filter(r=>r.day.startsWith(m)&&r.status!=="no_show").length],
    ["Annulés ce mois",rows.filter(r=>r.day.startsWith(m)&&r.status==="cancelled").length]];
  $("#stats").innerHTML=n.map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}

const STATUS={confirmed:"Confirmé",done:"Fait",no_show:"Absent",cancelled:"Annulé"};
function waLink(phone,r){let d=String(phone).replace(/\D/g,"");if(/^0\d{9}$/.test(d))d="61"+d.slice(1);
  const msg=`Salut ${r.first_name}, c’est Sabri (SBR_CUTZZ) pour ton rendez-vous du ${dayLabel(r.day)} à ${hm(r.slot)}.`;
  return`https://wa.me/${d}?text=${encodeURIComponent(msg)}`}
function renderList(){const t=today();
  const list=tab==="up"?rows.filter(r=>r.day>=t):rows.filter(r=>r.day<t).reverse();
  let html="",cur="";
  for(const r of list){if(r.day!==cur){cur=r.day;html+=`<div class="day">${dayLabel(r.day)}${r.day===t?" · aujourd’hui":""}</div>`}
    const off=r.status==="cancelled"||r.status==="no_show";
    html+=`<div class="bk${off?" off":""}"><div class="top"><span class="time">${hm(r.slot)}</span><span class="pill ${r.status}">${STATUS[r.status]}</span></div>
      <div class="name">${esc(r.first_name)} ${esc(r.last_name)}</div>
      <div class="meta"><a href="tel:${esc(r.phone.replace(/[^\d+]/g,""))}">${esc(r.phone)}</a>${r.email?` · ${esc(r.email)}`:""} · ${esc(r.ref)}</div>
      <div class="acts">
        <a class="btn small green" href="${waLink(r.phone,r)}" target="_blank" rel="noopener">WhatsApp</a>
        ${r.status!=="done"?`<button class="btn small" data-id="${r.id}" data-s="done">Fait</button>`:""}
        ${r.status!=="no_show"&&r.day<=t?`<button class="btn small" data-id="${r.id}" data-s="no_show">Absent</button>`:""}
        ${r.status!=="cancelled"?`<button class="btn small red" data-id="${r.id}" data-s="cancelled">Annuler</button>`:`<button class="btn small" data-id="${r.id}" data-s="confirmed">Rétablir</button>`}
      </div></div>`}
  $("#list").innerHTML=html||`<p class="muted" style="margin:14px 0 0">${tab==="up"?"Aucun rendez-vous à venir.":"Aucun rendez-vous ces 30 derniers jours."}</p>`;
  $("#listInfo").textContent=tab==="up"?"Mis à jour automatiquement toutes les minutes.":"30 derniers jours.";
  $("#list").querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{
    const s=b.dataset.s;if(s==="cancelled"&&!confirm("Annuler ce rendez-vous ? Le créneau redeviendra libre sur le site."))return;
    b.disabled=true;
    try{await api(`bookings?id=eq.${b.dataset.id}`,{method:"PATCH",body:{status:s}});await loadAll()}
    catch(e){b.disabled=false;alert(/duplicate|unique/i.test(e.message)?"Ce créneau a été repris par un autre client entre-temps.":"Impossible : "+e.message)}})}
$("#tUp").onclick=()=>{tab="up";$("#tUp").setAttribute("aria-pressed",true);$("#tPast").setAttribute("aria-pressed",false);renderList()};
$("#tPast").onclick=()=>{tab="past";$("#tPast").setAttribute("aria-pressed",true);$("#tUp").setAttribute("aria-pressed",false);renderList()};

function preview(){const v=$("#bfr").value.trim();$("#bprev").textContent=v;$("#bprev").hidden=!v}
$("#bfr").oninput=preview;
async function saveBanner(fr,en){$("#bmsg").textContent="";$("#bsave").disabled=true;
  try{await api("settings?id=eq.1",{method:"PATCH",body:{banner_fr:fr,banner_en:en,updated_at:new Date().toISOString()}});
    $("#bfr").value=fr;$("#ben").value=en;preview();$("#bmsg").textContent=fr?"Bannière en ligne ✓":"Bannière retirée ✓"}
  catch(e){$("#bmsg").textContent="";alert("Impossible d’enregistrer : "+e.message)}
  $("#bsave").disabled=false}
$("#bsave").onclick=()=>saveBanner($("#bfr").value.trim(),$("#ben").value.trim());
$("#bclear").onclick=()=>saveBanner("","");

function fillSlots(){if(!settings)return;const sel=$("#kslot"),keep=sel.value;const o=toMin(settings.open_time),c=toMin(settings.close_time),st=settings.slot_minutes;
  let h='<option value="">Toute la journée</option>';for(let m=o;m+st<=c;m+=st){const v=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");h+=`<option value="${v}">${v.replace(":","h")}</option>`}
  sel.innerHTML=h;sel.value=keep}
function renderBlocks(){$("#blocks").innerHTML=blocks.length?blocks.map(k=>`<div class="blk"><span><b style="text-transform:capitalize">${dayLabel(k.day)}</b> · ${k.slot?hm(k.slot):"toute la journée"}${k.note?`<br><span class="muted">${esc(k.note)}</span>`:""}</span><button class="btn small ghost" data-k="${k.id}">Débloquer</button></div>`).join(""):`<p class="muted" style="margin:0">Aucun créneau bloqué.</p>`;
  $("#blocks").querySelectorAll("button[data-k]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api(`blocks?id=eq.${b.dataset.k}`,{method:"DELETE"});await loadAll()}catch(e){b.disabled=false;alert("Impossible : "+e.message)}})}
$("#kday").value=today();$("#kday").min=today();
$("#kadd").onclick=async()=>{const day=$("#kday").value,slot=$("#kslot").value||null;$("#kmsg").textContent="";
  if(!day){$("#kmsg").textContent="Choisis un jour.";return}
  const clash=rows.filter(r=>r.day===day&&r.status==="confirmed"&&(!slot||r.slot.slice(0,5)===slot));
  if(clash.length&&!confirm(`${clash.length} rendez-vous déjà prévu(s) sur ce ${slot?"créneau":"jour"}. Ils ne seront pas annulés automatiquement. Bloquer quand même ?`))return;
  $("#kadd").disabled=true;
  try{await api("blocks",{method:"POST",body:{day,slot,note:$("#knote").value.trim()}});$("#knote").value="";$("#kmsg").textContent="Bloqué ✓";await loadAll()}
  catch(e){$("#kmsg").textContent=/duplicate|unique/i.test(e.message)?"Déjà bloqué.":"Impossible : "+e.message}
  $("#kadd").disabled=false};

setInterval(()=>{if(!$("#app").hidden&&!document.hidden)loadAll().catch(()=>{})},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#app").hidden)loadAll().catch(()=>{})});

(async()=>{
  if(!CONFIG.supabaseUrl||!CONFIG.supabaseKey){show("noconfig");return}
  if(store.get("sbr_admin_rt")){try{await ensureSession();await start();return}catch(e){store.set("sbr_admin_rt",null)}}
  show("login")})();
</script>
</body>
</html>
