# Garde le projet Supabase gratuit actif : une petite lecture tous les jours
# (Supabase met en pause un projet gratuit sans activité pendant 7 jours)
# Si Supabase ne répond plus, une « issue » GitHub est ouverte : le propriétaire du repo reçoit un e-mail.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://leuxyvrvphfbxsczobzd.supabase.co; K=sb_publishable_tnCSbUJwiwzxvl2lPwGPCA_QSq9SVbX
          # Lecture puis écriture (fonction keepalive) ; l'écriture est ignorée tant que schema.sql n'a pas été relancé
          curl -fsS --retry 3 --retry-delay 20 "$U/rest/v1/settings?select=id" -H "apikey: $K" > /dev/null
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$U/rest/v1/rpc/keepalive" -H "apikey: $K" -H "Content-Type: application/json" -d '{}')
          echo "keepalive: $code"; [ "$code" = 200 ] || [ "$code" = 404 ]
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Supabase ne répond plus : la réservation en ligne est en panne"
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "Le test automatique du $(date -u +%d/%m/%Y) n'a pas pu joindre Supabase. Va sur https://supabase.com/dashboard, ouvre le projet SBR_CUTZZ et clique sur « Restore project » s'il est en pause. Ferme cette issue une fois que c'est réglé."
          fi
