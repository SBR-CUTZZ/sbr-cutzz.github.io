# (Supabase met en pause un projet gratuit sans activité pendant 7 jours)
name: Supabase keepalive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://leuxyvrvphfbxsczobzd.supabase.co/rest/v1/settings?select=id" \
            -H "apikey: sb_publishable_tnCSbUJwiwzxvl2lPwGPCA_QSq9SVbX" > /dev/null
