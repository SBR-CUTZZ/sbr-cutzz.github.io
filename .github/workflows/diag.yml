name: diag
on:
  push:
    branches: [diag-gallery]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          google-chrome --headless=new --no-sandbox --window-size=390,844 --virtual-time-budget=10000 --dump-dom "https://sbr-cutzz.github.io/?x=$RANDOM" > dom.html 2>/dev/null || true
          echo "gph: $(grep -o 'class="gph"' dom.html | wc -l)  prices: $(grep -o 'class="card prices' dom.html | wc -l)"
          grep -o '<section class="gal[^>]*>' dom.html | head -2
