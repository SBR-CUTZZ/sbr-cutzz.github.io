  let formHtml="";

      <label class="f">${t("em")}<input class="in" id="em" type="email" inputmode="email" autocomplete="email" value="${esc(f.em)}">${e.em?`<div class="errtxt">${e.em}</div>`:""}</label>
      <label class="consent"><input type="checkbox" id="c" ${f.c?"checked":""}><span>${t("consent")}</span></label>${e.c?`<div class="errtxt">${e.c}</div>`:""}
      <div class="sum"><div class="b">SBR<b>_</b>CUTZZ</div><dl><dt>${t("date")}</dt><dd>${dayLabel(S.date)}</dd><dt>${t("time")}</dt><dd>${hhmm(S.time)}</dd><dt>${t("place")}</dt><dd>${t("place2")}</dd></dl>
      <button type="button" class="link" id="chg" style="margin-top:8px">${t("change")}</button></div>

function gcal(d){const[h,m]=d.time.split(":").map(Number);const pad=n=>String(n).padStart(2,"0");
  const st=d.date.replace(/-/g,"")+"T"+pad(h)+pad(m)+"00";const em=h*60+m+40;const en=d.date.replace(/-/g,"")+"T"+pad(Math.floor(em/60))+pad(em%60)+"00";
  const p=new URLSearchParams({action:"TEMPLATE",text:"SBR_CUTZZ (Sabri)",dates:st+"/"+en,ctz:TZ,location:BIZ.addr,details:"340 St Kilda Road, St Kilda VIC 3182 — "+d.ref});
  return "https://calendar.google.com/calendar/render?"+p}
// Écran d'accueil : Android/Chrome propose l'installation, iPhone affiche les étapes Safari
let installEvt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(S.view==="home")render()});
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const onSite=/(^|\.)github\.io$/.test(location.hostname);
function canInstall(){return onSite&&!isStandalone()}
function doInstall(){
  if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null});return}
  const safari=isIOS&&!/CriOS|FxiOS|EdgiOS|GSA|Instagram|FBAN|FBAV/.test(navigator.userAgent);
  const body=isIOS?(safari?`<ol><li>${t("ios1")}</li><li>${t("ios2")}</li><li>${t("ios3")}</li></ol>`:`<p class="muted" style="font-size:15px">${t("iosNot")}</p>`):`<ol><li>${t("desk1")}</li></ol>`;
  let sh=$("#sheet");if(!sh){sh=document.createElement("div");sh.id="sheet";sh.className="sheet";document.body.appendChild(sh);sh.onclick=e=>{if(e.target===sh)sh.hidden=true}}
  sh.innerHTML=`<div class="card in-anim" role="dialog" aria-modal="true"><h2 style="margin:0;font-size:20px">${isIOS?t("iosT"):t("deskT")}</h2>${body}<button class="btn gold" id="sheetOk">${t("ok")}</button></div>`;
  sh.hidden=false;$("#sheetOk").onclick=()=>sh.hidden=true}
if(onSite&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

// Bannière promo : première ligne de la feuille Google publiée en CSV
let promo=null;
function csvRow(txt){const out=[];let cur="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'&&txt[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
  else if(c==='"')q=true;else if(c===",")(out.push(cur),cur="");else if(c==="\n"||c==="\r")break;else cur+=c}
  out.push(cur);return out.map(x=>x.trim())}
function showPromo(){const el=$("#promo");const txt=promo&&(L==="en"&&promo[1]?promo[1]:promo[0]);el.textContent=txt||"";el.classList.toggle("on",!!txt)}
if(CONFIG.bannerCsv)fetch(CONFIG.bannerCsv+(CONFIG.bannerCsv.includes("?")?"&":"?")+"t="+Date.now()).then(r=>r.ok?r.text():"").then(x=>{promo=csvRow(x);showPromo()}).catch(()=>{});
setLang(L);
